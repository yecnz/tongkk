<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <script>
      // 첫 페인트 전에 OS를 감지해 전역 스케일을 분기한다(값 정의: src/index.css의 --app-scale).
      // 윈도우는 OS 기본 배율(125%)을 상쇄하도록 더 작은 스케일을 써서 맥과 비슷한 크기로 보이게 한다.
      // "darwin"에 "win"이 포함되므로 /win/i 단독 매칭은 금지.
      (function () {
        var p = (navigator.userAgentData && navigator.userAgentData.platform) || navigator.platform || navigator.userAgent || "";
        document.documentElement.dataset.platform = /windows|win32|win64/i.test(p) ? "windows" : "mac";
        
        // 사용자가 마이페이지에서 고른 화면 크기(작게 0.8 / 보통 0.9 / 크게 1)를
        // 첫 페인트 전에 적용해 깜빡임을 막는다. 값이 없거나 이상하면 CSS 기본값을 쓴다.
        try {
          var s = parseFloat(localStorage.getItem("tongkk-ui-scale"));
          if (s >= 0.7 && s <= 1.2) document.documentElement.style.setProperty("--app-scale", String(s));
        } catch (e) { /* localStorage 접근 불가 환경은 기본값 유지 */ }
        
        // 마지막 테마를 첫 페인트 전에 복원해 다크 사용자에게 라이트가 번쩍이지 않게 한다.
        // 진실 원천은 서버 프로필(src/services/theme.ts의 applyTheme가 로드 후 보정)이고 여기선 캐시만 읽는다.
        try {
          if (localStorage.getItem("tongkk:theme") === "dark") document.documentElement.dataset.theme = "dark";
        } catch (e) { /* 저장소 접근 불가 시 라이트 기본값 유지 */ }
      })();
    </script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css" integrity="sha512-SnH5WK+bZxgPHs44uWIX+LLJAJ9/2PkPKZ5QiAj6Ta86w+fsb2TkcmfRyVX3pBnMFcV7oQPJkl9QevSCWr3W6A==" crossorigin="anonymous" referrerpolicy="no-referrer" />

    <link rel="stylesheet" as="style" crossorigin href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.css" />
