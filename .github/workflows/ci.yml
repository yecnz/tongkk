name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          # Vite 8(rolldown)은 Node 20.19+ / 22.12+ 필요.
          node-version: '22'
          cache: npm
      - run: npm ci
      - name: Typecheck
        run: npx tsc --noEmit -p tsconfig.app.json
      - name: Lint (eslint + check-inline-hex)
        run: npm run lint
      - name: Unit tests
        run: npm test
      - name: Build
        run: npm run build
