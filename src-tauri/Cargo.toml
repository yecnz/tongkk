[package]
name = "tongkk-menubar"
version = "0.1.0"
description = "Tongkk 맥 메뉴바 팝오버"
edition = "2024"
rust-version = "1.90"

[lib]
name = "app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.7.6", features = [] }

[dependencies]
serde = { version = "1.0.229", features = ["derive"] }
tauri = { version = "2.12.7", features = ["tray-icon", "macos-private-api", "image-png"] }
tauri-plugin-autostart = "2.7.0"
tauri-plugin-global-shortcut = "2.4.1"
tauri-plugin-notification = "2.8.1"
