[package]
name = "tongkk-menubar"
version = "0.1.0"
description = "Tongkk 맥 메뉴바 팝오버"
edition = "2024"
rust-version = "1.90"

[lib]
name = "app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.7.6", features = [] }

[dependencies]
tauri = { version = "2.12.7", features = ["tray-icon", "macos-private-api", "image-png"] }
