<!doctype html>
<html lang="ko">
<head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Tongkk 모바일 UI 확인</title>
<style>
  body { margin: 0; font: 12px system-ui, sans-serif; background: Canvas; color: CanvasText; }
  header { box-sizing: border-box; width: 390px; height: 44px; display: flex; gap: 12px; align-items: center; justify-content: space-between; padding: 8px; }
  select { max-width: 180px; font: inherit; }
  iframe { display: block; border: 0; width: 390px; height: 660px; }
</style></head>
<body><header><strong>390px 모바일 미리보기</strong><label>화면 <select id="screen">
  <option value="/mypage?panel=drive">Google Drive</option><option value="/mypage?panel=notion">Notion</option>
  <option value="/mypage?panel=review">복습 설정</option><option value="/mypage?panel=calendar">캘린더 연동</option>
  <option value="/review?tab=today">복습 관리</option><option value="/review?tab=issues&amp;issueId=issue-process">학습 이슈</option>
  <option value="/stats?view=graph">개념 지도</option><option value="/stats?view=concepts&amp;conceptId=concept-process">개념 기록</option>
  <option value="/summary?panel=preparation">자료 자동 준비</option><option value="/summary">학습 메이트</option>
  <option value="/learn/review/review-process">복습 풀이</option><option value="/learn/session-process/revisions/revision-process">설명 개선</option>
</select></label></header><iframe title="390px 모바일 화면" src="/mypage?panel=drive"></iframe>
<script type="module">
  const select = document.getElementById('screen');
  const frame = document.querySelector('iframe');
  select.addEventListener('change', () => { frame.src = select.value; });
</script></body></html>
